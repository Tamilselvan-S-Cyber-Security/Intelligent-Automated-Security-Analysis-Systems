{% extends "base.html" %}
{% block title %}New Scan{% endblock %}

{% block content %}
<div class="scan-form">
    <h2 class="mb-4">Start New Security Scan</h2>
    <form id="scan-form" method="POST" action="{{ url_for('scan') }}">
        <div class="mb-3">
            <label for="url" class="form-label">Target URL</label>
            <input type="url" class="form-control" id="url" name="url" required 
                   placeholder="https://example.com">
        </div>

        <div class="mb-3">
            <label class="form-label">Scan Type</label>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="scan_type" 
                       id="basic" value="basic" checked>
                <label class="form-check-label" for="basic">Basic Scan</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="scan_type" 
                       id="api" value="api">
                <label class="form-check-label" for="api">API Scan</label>
            </div>
        </div>

        <div class="mb-3 api-key-section" style="display: none;">
            <label for="api_key" class="form-label">API Key</label>
            <input type="text" class="form-control" id="api_key" name="api_key" 
                   placeholder="Enter your API key">
        </div>

        <div class="mb-3">
            <label class="form-label">Attack Types</label>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="attack_xss" 
                       id="attack_xss">
                <label class="form-check-label" for="attack_xss">
                    Cross-Site Scripting (XSS)
                </label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="attack_sqli" 
                       id="attack_sqli">
                <label class="form-check-label" for="attack_sqli">
                    SQL Injection
                </label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="attack_ports" 
                       id="attack_ports">
                <label class="form-check-label" for="attack_ports">
                    Port Scanning
                </label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="attack_paths" 
                       id="attack_paths">
                <label class="form-check-label" for="attack_paths">
                    Path Discovery
                </label>
            </div>
        </div>

        <div class="mb-3">
            <label for="timeout" class="form-label">Scan Timeout (seconds)</label>
            <input type="number" class="form-control" id="timeout" name="timeout" 
                   min="5" max="60" value="30">
        </div>

        <button type="submit" class="btn btn-primary">Start Scan</button>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const apiScanRadio = document.getElementById('api');
    const apiKeySection = document.querySelector('.api-key-section');
    
    function toggleApiKeySection() {
        apiKeySection.style.display = apiScanRadio.checked ? 'block' : 'none';
    }
    
    apiScanRadio.addEventListener('change', toggleApiKeySection);
    document.getElementById('basic').addEventListener('change', toggleApiKeySection);
    
    toggleApiKeySection();
});
</script>
{% endblock %}
